name: Docker Compose Validation

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - '.github/workflows/docker-compose.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'

jobs:
  validate-docker-compose:
    name: Validate Docker Compose Stack
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose.yml
        run: docker compose config
      
      - name: Build services
        run: docker compose build
      
      - name: Start services
        run: docker compose up -d
      
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U inventory; do sleep 2; done'
          
          echo "Waiting for backend to be ready..."
          timeout 90 bash -c 'until curl -f http://localhost:8080/ 2>/dev/null; do sleep 2; done'
          
          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3000/ 2>/dev/null; do sleep 2; done'
      
      - name: Check service logs
        if: always()
        run: docker compose logs
      
      - name: Stop services
        if: always()
        run: docker compose down -v
