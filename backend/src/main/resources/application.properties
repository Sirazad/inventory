spring.application.name=inventory-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always

# JWT Configuration
# Secret key must be at least 512 bits (64 bytes) for HS512 algorithm
jwt.secret=inventorySecretKeyForJWTTokenGenerationAndValidation2024SecureKey
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Server Configuration
server.port=8080
